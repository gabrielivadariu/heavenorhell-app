services:
  - type: web
    name: god-devil-api-v2
    rootDir: backend
    env: node
    # Free preview only. Production uses Cloudflare Workers + D1 (see DEPLOY_CLOUDFLARE.md).
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_ENTITLEMENT_ID
        value: premium
      - key: PAID_CHAT_ENABLED
        value: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DAILY_TOKEN_BUDGET
        value: 300000
      - key: USAGE_STORE_PATH
        value: ./data/usage.json
      - key: TRUST_PROXY_HOPS
        value: 1
